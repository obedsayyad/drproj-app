# Load-balancer HAProxy config (docs/08). The whole ./haproxy directory is mounted at /usr/local/etc/haproxy/conf (a directory, not single
# files: files replaced by rename stay visible, a single-file bind mount would keep the old inode and a reload would re-read stale content). One file for CI and the VM: addresses and credentials come from the
# environment (PRIMARY_ADDR, APP_HOST, HAPROXY_STATS_USER, HAPROXY_STATS_PASSWORD), written by the lb role into .env (0600).
# Routing modes are runtime-only (Runtime API): warm_bk is the always-ready backup, warm_act is the non-backup line that is
# `maint` in normal mode (iwarm_bk/iwarm_act are the same pair for an interim warm standby); elastic lines are pre-declared and held in `maint` until StackStorm fills them (set server addr + state ready). Not `disabled`: a config-disabled line keeps CMAINT, which `state ready` does not clear (found live, P6.2); the lb role puts every unbound line in `maint` after the stack starts, and the server-state file keeps it across reloads.
global
    log stdout format raw local0
    maxconn 512
    master-worker
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    # NOTE: `stats socket ... ssl` is accepted by `haproxy -c` but IGNORED (the socket stays plaintext). The remote Runtime API is therefore
    # fe_admin below (TLS terminated by a normal frontend); only the local unix socket is a `stats socket`.
    server-state-file /var/lib/haproxy/server-state
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    load-server-state-from-file global
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout check 4s
    timeout http-request 10s

frontend fe_http
    bind :80
    monitor-uri /healthz
    acl acme_path path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless acme_path
    use_backend be_acme if acme_path

backend be_acme
    # The state file would restore a stale container address (Compose reassigns IPs on recreate); only be_app routing state is persisted.
    load-server-state-from-file none
    server acme acme:8888 init-addr libc,none

# Per-source-IP rate tracking (docs/08). Test host is never tracked.
backend st_gen
    stick-table type ip size 100k expire 60s store http_req_rate(10s)
backend st_post
    stick-table type ip size 100k expire 60s store http_req_rate(10s)
backend st_demo
    stick-table type ip size 100k expire 60s store http_req_rate(10s)

frontend fe_https
    bind :443 ssl crt /usr/local/etc/haproxy/certs/app.pem alpn h2,http/1.1
    unique-id-format %{+X}o\ %ci:%cp_%fi:%fp_%Ts_%rt:%pid
    unique-id-header X-Request-ID
    option http-buffer-request

    http-request deny deny_status 413 if { req.body_size gt 8192 }

    acl trusted_test src -f /usr/local/etc/haproxy/conf/trusted_test_ips.lst
    acl is_post method POST
    acl is_demo path_beg /api/demo/workload
    http-request track-sc0 src table st_gen unless trusted_test
    http-request track-sc1 src table st_post if is_post !trusted_test
    http-request track-sc2 src table st_demo if is_demo !trusted_test
    http-request return status 429 content-type text/plain hdr Retry-After 10 string "rate limit exceeded\n" if { sc_http_req_rate(0) gt 50 }
    http-request return status 429 content-type text/plain hdr Retry-After 10 string "rate limit exceeded\n" if { sc_http_req_rate(1) gt 20 }
    http-request return status 429 content-type text/plain hdr Retry-After 10 string "rate limit exceeded\n" if { sc_http_req_rate(2) gt 5 }

    http-response set-header Strict-Transport-Security "max-age=31536000"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy no-referrer
    http-response set-header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'"
    http-response set-header X-Request-ID %[unique-id]

    default_backend be_app

backend be_app
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/live hdr Host "${APP_HOST}"
    http-check expect status 200
    errorfile 503 /usr/local/etc/haproxy/conf/errors/503.http
    default-server inter 10s fall 3 rise 2 ssl verify required ca-file /usr/local/etc/haproxy/conf/ca-bundle.crt sni str("${APP_HOST}") check-sni "${APP_HOST}" verifyhost "${APP_HOST}" check
    server primary "${PRIMARY_ADDR}" rise 6 weight 256
    server warm_bk 0.0.0.0:8443 backup weight 100
    server warm_act 0.0.0.0:8443 weight 100
    server iwarm_bk 0.0.0.0:8443 backup weight 100 rise 2
    server iwarm_act 0.0.0.0:8443 weight 100 rise 2
    server elastic-do-1 0.0.0.0:8443 weight 100
    server elastic-do-2 0.0.0.0:8443 weight 100
    server elastic-do-3 0.0.0.0:8443 weight 100
    server elastic-do-4 0.0.0.0:8443 weight 100
    server elastic-do-5 0.0.0.0:8443 weight 100
    server elastic-linode-1 0.0.0.0:8443 weight 100
    server elastic-linode-2 0.0.0.0:8443 weight 100
    server elastic-linode-3 0.0.0.0:8443 weight 100
    server elastic-linode-4 0.0.0.0:8443 weight 100
    server elastic-linode-5 0.0.0.0:8443 weight 100

# Runtime API for the StackStorm runner (docs/08): mTLS (client certificate issued by the project CA, verify required) in front of the local
# admin socket, one allow-listed command per connection (admin_allow.regex, whole payload anchored, so ";"-chained commands never match).
frontend fe_admin
    mode tcp
    option tcplog
    bind :9999 ssl crt /usr/local/etc/haproxy/certs/lb-admin.pem ca-file /usr/local/etc/haproxy/conf/ca-bundle.crt verify required
    tcp-request inspect-delay 3s
    acl cli_allowed req.payload(0,0) -m reg -f /usr/local/etc/haproxy/conf/admin_allow.regex
    acl cli_line_done req.payload(0,0) -m reg [\n]
    tcp-request content accept if cli_allowed
    tcp-request content reject if cli_line_done
    tcp-request content reject if WAIT_END
    default_backend be_cli

backend be_cli
    mode tcp
    server cli unix@/var/run/haproxy/admin.sock

# Statistics and Prometheus exporter: TLS and basic auth (docs/08).
frontend fe_stats
    bind :8404 ssl crt /usr/local/etc/haproxy/certs/lb-admin.pem
    acl authed http_auth(stats_users)
    http-request auth realm drproj-stats unless authed
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s

userlist stats_users
    user "${HAPROXY_STATS_USER}" insecure-password "${HAPROXY_STATS_PASSWORD}"
