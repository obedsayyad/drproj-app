# P3.1 PLACEHOLDER (replaced in P6). Fails closed: no backend is configured, so every request is
# answered 503. It never routes traffic. The 443 and 8404 TLS listeners are added in P6 once
# certificates exist.
global
    log stdout format raw local0
    maxconn 256

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe_http
    bind :80
    monitor-uri /healthz
    http-request return status 503 content-type text/plain string "load balancer not configured\n"
