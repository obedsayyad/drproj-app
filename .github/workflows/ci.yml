name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/obedsayyad/drproj-relief

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration

  haproxy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: haproxy -c with throwaway material
        run: |
          set -eu
          d=$(mktemp -d)
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout "$d/k.pem" -out "$d/c.pem" -subj /CN=ci -days 1
          cat "$d/c.pem" "$d/k.pem" > "$d/app.pem"; cp "$d/app.pem" "$d/lb-admin.pem"; cp "$d/c.pem" "$d/ca-bundle.crt"
          cp deploy/compose/lb/haproxy/trusted_test_ips.lst.example "$d/trusted_test_ips.lst"
          h=deploy/compose/lb/haproxy
          mkdir -p "$d/conf" "$d/certs"
          cp -R "$h/errors" "$d/conf/errors"; cp "$h/haproxy.cfg" "$d/conf/"; cp "$d/ca-bundle.crt" "$d/trusted_test_ips.lst" "$d/conf/"
          cp "$d/app.pem" "$d/lb-admin.pem" "$d/certs/"
          docker run --rm --add-host acme:127.0.0.1 \
            -e PRIMARY_ADDR=10.0.0.1:8443 -e APP_HOST=app.example -e HAPROXY_STATS_USER=ci -e HAPROXY_STATS_PASSWORD=ci \
            -v "$d/conf:/usr/local/etc/haproxy/conf:ro" -v "$d/certs:/usr/local/etc/haproxy/certs:ro" \
            haproxy:3.2.26-alpine haproxy -c -f /usr/local/etc/haproxy/conf/haproxy.cfg

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The source label links the package to this public repository, so the package inherits its visibility.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/relief/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record digest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          {
            echo "### drproj-relief"
            echo
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
